# SOPS: Verschlüsselung der Geheimnisse im Repository (age). Empfänger = öffentliche age-Schlüssel der Betriebspersonen
# und der des Deploy-Workflows (Secret SOPS_AGE_KEY im Environment «production»).
#
# Einrichten (deploy/hetzner/README.md › Schritt 5):
#   age-keygen -o ~/.config/sops/age/keys.txt        # je Person; öffentlicher Teil «age1…» unten eintragen
#   age-keygen -o deploy-key.txt                      # Deploy-Workflow; Inhalt als Secret SOPS_AGE_KEY, Datei löschen
# Nach jeder Änderung der Empfänger: sops updatekeys deploy/hetzner/secrets.sops.yaml
#
# Empfänger: betrieb (Betriebsperson, privater Schlüssel im Passwortmanager), deploy (Secret SOPS_AGE_KEY).
creation_rules:
  - path_regex: ^deploy/hetzner/secrets\.sops\.yaml$
    age: >-
      age1tapagx9rj38nslwgmzqzsjkdjffnfq2kmvucw59yfcwf743pp9dq0u8drh,
      age1mqee8y8a2s6sscvn5nkemdyudulnhgt9x22g3z5fznvuhw7uaeaqlhgksf
  - path_regex: ^infra/.*\.sops\.(yaml|json)$
    age: >-
      age1tapagx9rj38nslwgmzqzsjkdjffnfq2kmvucw59yfcwf743pp9dq0u8drh
