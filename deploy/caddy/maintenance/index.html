<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPM – Wartung</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #5c5c58; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ededea; --muted: #a3a39e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>PPM wird gerade gewartet</h1>
  <p>Wir sind gleich wieder für dich da. Versuch es in ein paar Minuten noch einmal.</p>
</main>
</body>
</html>
