# Zugriff nur lokal im Container und über TLS aus dem privaten Netz (Platzhalter 10.20.0.0/16 = network_ip_range
# aus infra/hetzner). Keine Verbindung ohne TLS von aussen.
# TYP      DATENBANK  BENUTZER  ADRESSE         METHODE
local      all        all                       peer
host       all        all       127.0.0.1/32    scram-sha-256
hostssl    ppm        all       10.20.0.0/16    scram-sha-256
hostnossl  all        all       0.0.0.0/0       reject
