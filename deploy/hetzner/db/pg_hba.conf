# Zugang zur Datenbank (ersetzt /etc/postgresql/17/main/pg_hba.conf, setup.sh)
# TYPE   DATABASE      USER          ADDRESS         METHOD
local    all           postgres                      peer
local    all           all                           scram-sha-256
# App-VM im privaten Netz, nur TLS
hostssl  ppm  ppm_runtime  10.0.1.10/32  scram-sha-256
hostssl  ppm  ppm_worker   10.0.1.10/32  scram-sha-256
hostssl  ppm  ppm_owner    10.0.1.10/32  scram-sha-256
# alles andere abgelehnt
host     all           all           0.0.0.0/0       reject
host     all           all           ::/0            reject
