# pgBackRest für PITR: Repository in Hetzner Object Storage (S3), verschlüsselt (Passphrase in secrets/pgbackrest.env),
# Bucket, Endpunkt, Region und Schlüssel über PGBACKREST_REPO1_* aus der Umgebung des Containers.
[global]
repo1-type=s3
repo1-path=/ppm
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=35
repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
start-fast=y
delta=y

[ppm]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
