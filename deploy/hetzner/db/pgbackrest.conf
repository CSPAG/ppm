# /etc/pgbackrest/pgbackrest.conf – Backup und PITR in den Object Storage (Bucket ppm-pgbackrest).
# Schlüssel (repo1-s3-key, repo1-s3-key-secret, repo1-cipher-pass) NICHT hier, sondern in
# /etc/pgbackrest/conf.d/secrets.conf (0600, postgres; aus SOPS, setup.sh).
[global]
repo1-type=s3
repo1-s3-bucket=ppm-pgbackrest
repo1-s3-endpoint=nbg1.your-objectstorage.com
repo1-s3-region=nbg1
repo1-s3-uri-style=path
repo1-path=/ppm
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=14
start-fast=y
compress-type=zst
process-max=2
log-level-console=info
log-level-file=detail

[ppm]
pg1-path=/var/lib/postgresql/17/main
pg1-port=5432
