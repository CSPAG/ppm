# Ergänzung zu /etc/postgresql/17/main/postgresql.conf (als conf.d/ppm.conf, setup.sh legt sie ab).
listen_addresses = '10.0.1.20'           # nur privates Netz (infra/hetzner › db_private_ip)
port = 5432
max_connections = 200
password_encryption = scram-sha-256

# TLS: Zertifikat für db.ppm.internal, ausgestellt von der eigenen CA (setup.sh); die App prüft mit verify-full
ssl = on
ssl_cert_file = '/etc/postgresql/17/main/tls/server.crt'
ssl_key_file = '/etc/postgresql/17/main/tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'

# WAL-Archiv für PITR über pgBackRest
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=ppm archive-push %p'
archive_timeout = 60s
max_wal_senders = 3

# Protokoll
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d %a '
shared_preload_libraries = 'pg_stat_statements'
