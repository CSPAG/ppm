# PostgreSQL 17 auf der DB-VM (eingehängt als config_file). Werte für eine VM mit 4 GB RAM; bei grösserem Typ
# shared_buffers (25 %) und effective_cache_size (75 %) anpassen.
listen_addresses = '*'
port = 5432
max_connections = 200
password_encryption = scram-sha-256

# TLS mit Zertifikat der privaten CA (die App prüft mit DATABASE_SSL=verify-full und NODE_EXTRA_CA_CERTS)
ssl = on
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'
ssl_ca_file = '/etc/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# WAL-Archiv für PITR über pgBackRest
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=ppm archive-push %p'
archive_timeout = 60s
max_wal_senders = 3
wal_compression = on

# Sicherheit und Betrieb
idle_in_transaction_session_timeout = 60s
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_lock_waits = on
shared_preload_libraries = 'pg_stat_statements'
timezone = 'UTC'
