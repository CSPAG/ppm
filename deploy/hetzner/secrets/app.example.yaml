# Vorlage der Geheimnisse der App-VM. Echte Werte nur verschlüsselt mit SOPS (.sops.yaml) als app.enc.yaml:
#   cp app.example.yaml app.dec.yaml && $EDITOR app.dec.yaml
#   sops encrypt --filename-override deploy/hetzner/secrets/app.enc.yaml app.dec.yaml > app.enc.yaml && rm app.dec.yaml
# Jeder Schlüssel wird beim Deploy zur Datei /opt/ppm/secrets/<schlüssel> (0400, UID 1000); welcher Dienst welche
# Datei bekommt, steht in deploy/compose.prod.yaml. Unverschlüsselte Dateien (*.dec.*) ignoriert git.
# migrate liest DATABASE_SSL nicht: TLS für die Besitzer-Rolle über sslmode in der URL
database_admin_url: postgres://ppm_owner:<passwort>@10.20.1.20:5432/ppm?sslmode=verify-full
database_url: postgres://ppm_runtime:<passwort>@10.20.1.20:5432/ppm
database_worker_url: postgres://ppm_worker:<passwort>@10.20.1.20:5432/ppm
session_secret: <mindestens 32 Zeichen, z. B. openssl rand -base64 48>
encryption_keys: k1:<openssl rand -base64 32>
oidc_bff_private_key: |
  -----BEGIN PRIVATE KEY-----
  <PKCS#8 des Clients ppm-platform>
  -----END PRIVATE KEY-----
keycloak_mgmt_private_key: |
  -----BEGIN PRIVATE KEY-----
  <PKCS#8 des Clients ppm-admin>
  -----END PRIVATE KEY-----
keycloak_sync_private_key: |
  -----BEGIN PRIVATE KEY-----
  <PKCS#8 des Clients ppm-sync>
  -----END PRIVATE KEY-----
mcp_private_key: |
  -----BEGIN PRIVATE KEY-----
  <PKCS#8 des Clients ppm-mcp>
  -----END PRIVATE KEY-----
mcp_dpop_key: |
  -----BEGIN PRIVATE KEY-----
  <EC P-256, PKCS#8>
  -----END PRIVATE KEY-----
db_ca.crt: |
  -----BEGIN CERTIFICATE-----
  <öffentliches Zertifikat der privaten CA der Datenbank>
  -----END CERTIFICATE-----
