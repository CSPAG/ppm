# Vorlage der Geheimnisse der DB-VM, verschlüsselt als db.enc.yaml (wie app.example.yaml). Auf der DB-VM:
#   postgres_password  → /opt/ppm-db/secrets/postgres_password (Superuser postgres)
#   pgbackrest_*       → /opt/ppm-db/secrets/pgbackrest.env (PGBACKREST_REPO1_S3_KEY=…, …_S3_KEY_SECRET=…, …_CIPHER_PASS=…)
#   tls_*              → /opt/ppm-db/secrets/tls/server.crt, server.key (0400, UID 999), ca.crt
# Die Passwörter der Rollen setzt db/bootstrap.sql (owner_pw, runtime_pw, worker_pw) – dieselben wie in app.enc.yaml.
postgres_password: <openssl rand -base64 32>
owner_pw: <passwort ppm_owner>
runtime_pw: <passwort ppm_runtime>
worker_pw: <passwort ppm_worker>
pgbackrest_s3_key: <Access Key Hetzner Object Storage>
pgbackrest_s3_key_secret: <Secret Key Hetzner Object Storage>
pgbackrest_cipher_pass: <openssl rand -base64 48>
tls_server_crt: |
  -----BEGIN CERTIFICATE-----
  <Zertifikat der DB-VM, SAN = private Adresse und Name der DB-VM>
  -----END CERTIFICATE-----
tls_server_key: |
  -----BEGIN PRIVATE KEY-----
  <Schlüssel der DB-VM>
  -----END PRIVATE KEY-----
tls_ca_crt: |
  -----BEGIN CERTIFICATE-----
  <Zertifikat der privaten CA>
  -----END CERTIFICATE-----
