# REST-API, BFF und Auslieferung der Webapp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppm-api
  labels: { app.kubernetes.io/name: ppm-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: ppm-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ppm-api, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ppm
      # > SHUTDOWN_DELAY (5s) + SHUTDOWN_TIMEOUT (25s)
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ppm
          args: ["api"]
          envFrom: [{ configMapRef: { name: ppm-config } }]
          env:
            - { name: OTEL_SERVICE_NAME, value: ppm-api }
            - { name: DATABASE_URL_FILE, value: /run/secrets/database_url }
            # CA der Datenbank (DATABASE_SSL=verify-full; createPool nimmt keine eigene CA an)
            - { name: NODE_EXTRA_CA_CERTS, value: /run/secrets/database_ca }
            - { name: SESSION_SECRET_FILE, value: /run/secrets/session_secret }
            - { name: ENCRYPTION_KEYS_FILE, value: /run/secrets/encryption_keys }
            - { name: OIDC_BFF_PRIVATE_KEY_FILE, value: /run/secrets/oidc_bff_private_key }
            - { name: KEYCLOAK_MGMT_PRIVATE_KEY_FILE, value: /run/secrets/keycloak_mgmt_private_key }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ops, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 15
            failureThreshold: 4
          startupProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: secrets, secret: { secretName: ppm-api, defaultMode: 0400 } }
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ppm-api
  labels: { app.kubernetes.io/name: ppm-api }
spec:
  selector: { app.kubernetes.io/name: ppm-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
