# Ein Host. /mcp und die Protected Resource Metadata (RFC 9728) zum MCP-Dienst, alles andere zur API.
# TLS-Zertifikat im Secret ppm-tls (z. B. cert-manager mit Annotation im Overlay).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ppm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # Streamable HTTP (SSE) des MCP-Dienstes nicht puffern
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ppm.project-suite.ch]
      secretName: ppm-tls
  rules:
    - host: ppm.project-suite.ch
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service: { name: ppm-mcp, port: { name: mcp } }
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service: { name: ppm-mcp, port: { name: mcp } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: ppm-api, port: { name: http } }
