# Prozess mcp (Profil mcp): MCP über Streamable HTTP (8081), Client der REST-API, ohne Datenbank
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppm-mcp
  labels: { app.kubernetes.io/name: ppm, app.kubernetes.io/component: mcp }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: ppm, app.kubernetes.io/component: mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ppm, app.kubernetes.io/component: mcp }
    spec:
      serviceAccountName: ppm
      automountServiceAccountToken: false
      # länger als SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT (5 s + 20 s)
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          image: ghcr.io/cspag/ppm
          args: [mcp]
          ports:
            - { name: mcp, containerPort: 8081 }
            - { name: ops, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: ppm-config }
          env:
            - { name: MCP_PRIVATE_KEY_FILE, value: /run/secrets/ppm/mcp_private_key }
            - { name: MCP_DPOP_KEY_FILE, value: /run/secrets/ppm/mcp_dpop_key }
          startupProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/ppm, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret: { secretName: ppm-mcp, defaultMode: 0440 }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ppm-mcp
  labels: { app.kubernetes.io/name: ppm, app.kubernetes.io/component: mcp }
spec:
  selector: { app.kubernetes.io/name: ppm, app.kubernetes.io/component: mcp }
  ports:
    - { name: mcp, port: 8081, targetPort: mcp }
    - { name: ops, port: 9090, targetPort: ops }
