# Migrationen (Besitzer-Rolle) vor api und worker; endet danach. Jobs sind unveränderlich: vor einem neuen Image den
# alten Job löschen (oder Argo CD mit dem Hook unten).
apiVersion: batch/v1
kind: Job
metadata:
  name: ppm-migrate
  labels: { app.kubernetes.io/name: ppm, app.kubernetes.io/component: migrate }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: ppm, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: ppm
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/cspag/ppm
          args: [migrate]
          envFrom:
            - configMapRef: { name: ppm-config }
          env:
            - { name: NODE_EXTRA_CA_CERTS, value: /run/secrets/db-ca/ca.crt }
            - { name: DATABASE_ADMIN_URL_FILE, value: /run/secrets/ppm/database_admin_url }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/ppm, readOnly: true }
            - { name: db-ca, mountPath: /run/secrets/db-ca, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret: { secretName: ppm-migrate, defaultMode: 0440 }
        - name: db-ca
          configMap: { name: ppm-db-ca, defaultMode: 0444 }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
