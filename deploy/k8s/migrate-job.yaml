# Migrationen als eigener Schritt vor dem Rollout (App und Baukasten), Rolle ppm_owner.
# Das Overlay ersetzt den Namen je Rollout (z. B. nameSuffix mit Version) oder löscht den Job vorher.
apiVersion: batch/v1
kind: Job
metadata:
  name: ppm-migrate
  labels: { app.kubernetes.io/name: ppm-migrate, app.kubernetes.io/component: migrate }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: ppm-migrate, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: ppm
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ppm
          args: ["migrate"]
          envFrom: [{ configMapRef: { name: ppm-config } }]
          env:
            - { name: DATABASE_ADMIN_URL_FILE, value: /run/secrets/database_admin_url }
            # CA der Datenbank (DATABASE_SSL=verify-full; createPool nimmt keine eigene CA an)
            - { name: NODE_EXTRA_CA_CERTS, value: /run/secrets/database_ca }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: secrets, secret: { secretName: ppm-migrate, defaultMode: 0400 } }
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
