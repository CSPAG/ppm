<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PPM – Wartung</title>
  <!-- Statische Wartungsseite (Caddy, 503): ohne Skripte und ohne externe Ressourcen -->
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2330; --muted: #5a6476; --card: #ffffff; --accent: #2457c5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e8ebf0; --muted: #a3acbb; --card: #1a2029; --accent: #7aa2ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 32rem; width: 100%; background: var(--card); border-radius: 12px; padding: 32px 28px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { margin: 0 0 12px; color: var(--muted); }
    .marke { font-weight: 700; color: var(--accent); letter-spacing: 0.02em; margin-bottom: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="marke">PPM</div>
    <h1>Wir sind gleich zurück</h1>
    <p>PPM wird gerade gewartet oder neu gestartet. Deine Daten sind sicher.</p>
    <p>Bitte versuche es in ein paar Minuten noch einmal.</p>
  </main>
</body>
</html>
